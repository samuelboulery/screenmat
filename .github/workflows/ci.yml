name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # Les tests de capture d'URL exigent un navigateur en CI (ils ne sautent
      # qu'en local) : le Chromium headless de Playwright, sans dépendre du
      # Chrome que l'image du runner fournit ou non.
      - run: pnpm exec playwright-core install --with-deps --only-shell chromium

      # La capture lance Chromium avec son bac à sable, qui a besoin des user
      # namespaces non privilégiés ; Ubuntu 24.04 les restreint par AppArmor.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - run: pnpm test
