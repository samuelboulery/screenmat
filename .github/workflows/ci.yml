name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # Les tests de capture d'URL exigent un navigateur en CI (ils ne sautent
      # qu'en local) : le Chromium headless de Playwright, sans dépendre du
      # Chrome que l'image du runner fournit ou non.
      - run: pnpm exec playwright-core install --with-deps --only-shell chromium

      # La capture lance Chromium avec son bac à sable, qui a besoin des user
      # namespaces non privilégiés ; Ubuntu 24.04 les restreint par AppArmor.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - run: pnpm test
