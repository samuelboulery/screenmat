name: Release

on:
  push:
    tags: ['v*']

jobs:
  # Tout ce qui exécute du code du dépôt (install, tests) tourne ici avec des
  # droits en lecture seule : aucun jeton d'écriture ni de provenance.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historique complet : le garde « sur main » en a besoin.
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      # Un tag qui ne dit pas la version du paquet publierait autre chose que
      # ce qu'il annonce.
      - name: Tag et version concordent
        run: |
          version=$(node -p "require('./package.json').version")
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "tag ${GITHUB_REF_NAME} ≠ version ${version}"; exit 1; }

      # Sans ce garde, quiconque peut pousser un tag publie le code de
      # n'importe quelle branche, non relu, avec une provenance valide.
      - name: Le tag est sur main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "le commit ${GITHUB_SHA} n'est pas sur main"; exit 1; }

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm exec playwright-core install --with-deps --only-shell chromium

      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - run: pnpm test

      # `prepack` reconstruit `dist-npm/` avant d'empaqueter. Le paquet est
      # joint à la release du tag sous un nom fixe : l'URL
      # `releases/latest/download/screenmat.tgz` reste stable d’une version à l’autre.
      - name: Paquet
        run: |
          pnpm pack --pack-destination release
          mv release/screenmat-*.tgz release/screenmat.tgz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenmat-package
          path: release/screenmat.tgz
          if-no-files-found: error

  # Seul job à détenir des droits d'écriture : il ne récupère ni n'exécute
  # aucun code du dépôt, il ne publie que le paquet construit plus haut.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # Créer la release GitHub et y joindre le paquet.
      contents: write
      # Provenance npm : la signature prouve que le paquet sort de ce dépôt.
      id-token: write
    env:
      # Lu par le garde ci-dessous : un secret ne se teste pas dans `if:`.
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      # Échouer avant de créer quoi que ce soit plutôt qu'à mi-chemin.
      - name: Le secret NPM_TOKEN existe
        run: test -n "$NPM_TOKEN" || { echo "secret NPM_TOKEN absent"; exit 1; }

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: screenmat-package

      - name: Release GitHub
        # Une relance après un échec npm retrouve la release déjà créée : elle y
        # remplace le paquet au lieu d'échouer, et atteint l'étape npm.
        run: |
          gh release create "$GITHUB_REF_NAME" screenmat.tgz --verify-tag --generate-notes --repo "$GITHUB_REPOSITORY" \
            || gh release upload "$GITHUB_REF_NAME" screenmat.tgz --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Pas de checkout ici, donc pas de `packageManager` à lire.
          version: 10.12.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # Pas de checkout ici : rien à mettre en cache, et pas de cache restauré
          # dans le job qui détient les droits d'écriture.
          package-manager-cache: false

      - run: pnpm publish ./screenmat.tgz --provenance --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
