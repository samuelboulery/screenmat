name: Release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Créer la release GitHub et y joindre le paquet.
      contents: write
      # Provenance npm : la signature prouve que le paquet sort de ce dépôt.
      id-token: write
    env:
      # Lu par la condition de l'étape npm : un secret ne se teste pas dans `if:`.
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Historique complet : le garde « sur main » en a besoin.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Un tag qui ne dit pas la version du paquet publierait autre chose que
      # ce qu'il annonce.
      - name: Tag et version concordent
        run: |
          version=$(node -p "require('./package.json').version")
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "tag ${GITHUB_REF_NAME} ≠ version ${version}"; exit 1; }

      # Sans ce garde, quiconque peut pousser un tag publie le code de
      # n'importe quelle branche, non relu, avec une provenance valide.
      - name: Le tag est sur main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "le commit ${GITHUB_SHA} n'est pas sur main"; exit 1; }

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm exec playwright-core install --with-deps --only-shell chromium

      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - run: pnpm test

      # `prepack` reconstruit `dist-npm/` avant d'empaqueter. Le paquet est
      # joint à la release du tag sous un nom fixe : l'URL
      # `releases/latest/download/screenmat.tgz` des docs reste juste à chaque version.
      - name: Paquet
        run: |
          pnpm pack --pack-destination release
          mv release/screenmat-*.tgz release/screenmat.tgz

      - name: Release GitHub
        run: gh release create "$GITHUB_REF_NAME" release/*.tgz --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

      # ponytail: sauté tant que le secret NPM_TOKEN n'existe pas ; le créer
      # suffit à publier aussi sur npm, sans toucher au workflow.
      - if: env.NPM_TOKEN != ''
        run: pnpm publish --provenance --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
