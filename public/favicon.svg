<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="screenmat">
  <!-- Le mark : les quatre équerres d'une capture, encre sur papier. Tuile
       opaque pour tenir dans un onglet clair comme sombre ; elle s'inverse
       quand le système est en sombre. -->
  <style>
    .tile { fill: #f3f2ee }
    .ink { stroke: #111111 }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #121110 }
      .ink { stroke: #edebe5 }
    }
  </style>
  <rect class="tile" width="32" height="32" rx="3" />
  <path class="ink" d="M7 13V7h6M19 7h6v6M25 19v6h-6M13 25H7v-6" fill="none" stroke-width="3" stroke-linecap="square" />
</svg>
